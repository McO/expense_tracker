<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="512" cy="512" r="400" fill="url(#gradient)"/>
  
  <!-- White inner circle -->
  <circle cx="512" cy="512" r="300" fill="white" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Wallet icon -->
  <g transform="translate(512, 512)">
    <!-- Wallet body -->
    <rect x="-120" y="-80" width="240" height="160" rx="20" fill="#2196F3"/>
    
    <!-- Wallet fold -->
    <rect x="-120" y="-80" width="240" height="40" rx="20" fill="#1976D2"/>
    
    <!-- Card slots -->
    <rect x="-100" y="-60" width="200" height="25" rx="5" fill="white" opacity="0.9"/>
    <rect x="-100" y="-25" width="180" height="25" rx="5" fill="white" opacity="0.7"/>
    <rect x="-100" y="10" width="160" height="25" rx="5" fill="white" opacity="0.5"/>
    
    <!-- Money symbol -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="#2196F3">€</text>
  </g>
</svg> 